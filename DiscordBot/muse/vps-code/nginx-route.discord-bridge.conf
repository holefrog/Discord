# project: discord-bridge  backend: 127.0.0.1:3001
# 本项目自带的路由片段：部署时投放到 VPS 的 /etc/nginx/muse-routes/discord-bridge.conf，
# 再执行底座提供的 muse-nginx-reload 生效。底座（骨架、片段目录、重载命令）由 Ansible
# 在开荒时统一部署，不在本项目范围内。
location /api/bridge/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
